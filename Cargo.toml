[package]
name = "uu-linux-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Unofficial native Linux and macOS client for UU LAN Play relay and peer-to-peer rooms"
repository = "https://github.com/kevinhaofeng-bot/uu-relay-linux-client"
readme = "README.md"
keywords = ["linux", "macos", "tun", "lan-play", "p2p"]
categories = ["network-programming"]
publish = false

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
md-5 = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "cookies", "json", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
signal-hook = "0.3"
